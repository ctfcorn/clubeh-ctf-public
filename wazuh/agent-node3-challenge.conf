<!-- Challenge host: this node has NO internet. Any egress attempt is an escape. -->
<ossec_config>
  <localfile><log_format>syslog</log_format><location>/var/log/kern.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/syslog</location></localfile>
  <localfile><log_format>command</log_format>
    <command>docker events --since 60s --until 1s --filter type=container --format 'ctf-docker-event {{.Action}} {{.Actor.Attributes.name}}'</command>
    <frequency>60</frequency>
  </localfile>
  <syscheck>
    <directories check_all="yes" realtime="yes">/opt/ctf</directories>
  </syscheck>
</ossec_config>
