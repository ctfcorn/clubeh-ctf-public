<!-- CTFd host: application logs are the event's audit trail -->
<ossec_config>
  <localfile><log_format>syslog</log_format><location>/opt/ctf/data/CTFd/logs/submissions.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/ctf/data/CTFd/logs/logins.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/ctf/data/CTFd/logs/registrations.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/ctf/data/CTFd/logs/vpn_handout.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/kern.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/syslog</location></localfile>
  <!-- Docker service lifecycle: a challenge crash-looping shows up here -->
  <localfile><log_format>command</log_format>
    <command>docker events --since 60s --until 1s --filter type=service --format 'ctf-docker-event {{.Action}} {{.Actor.Attributes.name}}'</command>
    <frequency>60</frequency>
  </localfile>
  <syscheck>
    <directories check_all="yes" realtime="yes">/opt/ctf/stack</directories>
    <directories check_all="yes" realtime="yes">/opt/ctf/docker-compose.yml</directories>
  </syscheck>
</ossec_config>
