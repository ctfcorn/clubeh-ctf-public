<!-- Gateway: VPN sessions, firewall drops, proxy, auth -->
<ossec_config>
  <localfile><log_format>syslog</log_format><location>/var/log/kern.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/openvpn/openvpn.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/syslog</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/tinyproxy/tinyproxy.log</location></localfile>
  <syscheck>
    <directories check_all="yes" realtime="yes">/etc/openvpn/server/ccd</directories>
    <directories check_all="yes" realtime="yes">/etc/ctf</directories>
    <directories check_all="yes">/etc/nftables.conf</directories>
  </syscheck>
</ossec_config>
